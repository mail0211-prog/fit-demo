<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FIT: 투자성향 연계형 MTS 개인화 엔진 시연 프로토타입 (가상 데이터)">
<title>FIT 개인화 MTS 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a working demo — phone MTS on the left, the engine's reasoning on the right, so judges see what changed and why. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#15212A; --ink-2:#48565F; --ink-3:#77848C;
  --line:#D8DEE2; --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#DDEFEC;
  --up:#D2352B; --down:#1E5FD2; --warn:#A8670F; --warn-soft:#FBF0DC;
  --g1:#D2402F; --g2:#DE7A2A; --g3:#C9A21E; --g4:#4F9443; --g5:#3E93BE; --g6:#2D58A8;
  --shadow:0 1px 2px rgba(21,33,42,.06),0 8px 24px rgba(21,33,42,.06);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#161F25; --surface-2:#1C272E; --ink:#E4EBEF; --ink-2:#A8B5BC; --ink-3:#7C8990;
  --line:#2A3740; --accent:#3DB3A9; --accent-ink:#06201E; --accent-soft:#16332F;
  --up:#FF6A5E; --down:#6E9EFF; --warn:#E3A84B; --warn-soft:#33270F;
  --g1:#F0685A; --g2:#F0994E; --g3:#E2C04A; --g4:#76B868; --g5:#68B3DB; --g6:#7E9FE6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#161F25; --surface-2:#1C272E; --ink:#E4EBEF; --ink-2:#A8B5BC; --ink-3:#7C8990;
  --line:#2A3740; --accent:#3DB3A9; --accent-ink:#06201E; --accent-soft:#16332F;
  --up:#FF6A5E; --down:#6E9EFF; --warn:#E3A84B; --warn-soft:#33270F;
  --g1:#F0685A; --g2:#F0994E; --g3:#E2C04A; --g4:#76B868; --g5:#68B3DB; --g6:#7E9FE6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
@media (max-width:480px){.wrap{padding-inline:16px}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mark{font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1}
.mark b{color:var(--accent)}
.brand p{margin:0;color:var(--ink-2);font-size:14px}
.demo-pill{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tabs .step{font-family:var(--f-mono);font-size:12px;margin-right:6px;opacity:.7}

/* scenario strip */
.scen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scen .lbl{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;margin-right:4px}
.chipbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,388px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.phone{margin-inline:auto}}

/* phone */
.phone{width:100%;max-width:388px;height:760px;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:480px){.phone{height:680px;border-radius:22px}}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;font-size:12px;color:var(--ink-3)}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
.appbar h2{margin:0;font-size:17px;font-weight:700}
.appbar .who{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.3}
.screen{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 10px}
.tabbar button{border:0;background:transparent;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabbar button[aria-current="true"]{color:var(--ink);font-weight:700}
.tabbar .ico{width:20px;height:20px;border-radius:6px;border:1.5px solid currentColor}
.tabbar .order .ico{background:var(--accent);border-color:var(--accent)}
.tabbar .order{color:var(--accent)}
.lock-note{font-size:10.5px;color:var(--ink-3);text-align:center;padding:0 8px 6px;background:var(--surface)}

.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mod-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod-h h3{margin:0;font-size:14px;font-weight:700}
.mod-h .more{font-size:12px;color:var(--ink-3);border:0;background:none}
.pinmark{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-of-type{border-top:0}
.row .nm{display:flex;flex-direction:column;min-width:0}
.row .nm b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11.5px;color:var(--ink-3)}
.row .px{text-align:right;font-size:13px}
.up{color:var(--up)} .down{color:var(--down)}
.grade{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap;color:var(--ink)}
.grade::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gc)}
.grade{background:color-mix(in srgb,var(--gc) 16%,transparent)}
.g1{--gc:var(--g1)}.g2{--gc:var(--g2)}.g3{--gc:var(--g3)}.g4{--gc:var(--g4)}.g5{--gc:var(--g5)}.g6{--gc:var(--g6)}
.note{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.note.warn{color:var(--ink);background:var(--warn-soft)}
.big{font-size:22px;font-weight:700}
.alloc{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.glossary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.glossary button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:2px}
.glossary b{font-size:13px}
.ob{display:grid;grid-template-columns:1fr auto 1fr;font-size:12px;gap:2px 8px}
.ob .s{text-align:right;color:var(--down)} .ob .b{color:var(--up)} .ob .p{text-align:center;font-weight:600}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btns{display:flex;gap:6px;flex-wrap:wrap}

.rec{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec .why{font-size:11.5px;color:var(--ink-2)}
.rec p{margin:0;font-weight:600;font-size:13.5px}
.rec .tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.mismatch{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mismatch .tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--warn)}
.mismatch p{margin:0;font-size:13px}
.folded{border:1px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface)}

/* detail */
.back{border:0;background:none;font-size:13px;color:var(--ink-2);padding:0;align-self:flex-start}
.dhead{display:flex;flex-direction:column;gap:4px}
.dhead h3{margin:0;font-size:18px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:5px 0;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right}
.plain{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.sheet-wrap{position:absolute;inset:0;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:88%;overflow-y:auto}
.sheet h4{margin:0;font-size:15px}
.fit-line{font-size:12.5px;color:var(--ink-2)}
.check{display:grid;grid-template-columns:24px 1fr;gap:2px 8px;border:1px solid var(--line);border-radius:12px;padding:10px}
.check .no{grid-row:span 2;font-weight:700;color:var(--warn)}
.check b{font-size:13px} .check span{font-size:12px;color:var(--ink-2)}
.src{font-size:10.5px;color:var(--ink-3)}

/* settings */
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt b{font-size:13px;display:block}.opt span{font-size:12px;color:var(--ink-2)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.twocol ul{margin:4px 0 0;padding-left:16px;color:var(--ink-2)}

/* engine panel */
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.card h3 .src-tag{font-weight:600;letter-spacing:0;color:var(--ink-3);margin-left:6px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{display:flex;flex-direction:column;gap:2px}
.metric small{font-size:11.5px;color:var(--ink-3)}
.metric strong{font-size:18px;font-weight:700}
.shares{display:flex;flex-direction:column;gap:6px}
.share{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:8px;font-size:12px}
.share .bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.share .v{text-align:right}
.path{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.path b{color:var(--ink)}
.sim{display:flex;flex-wrap:wrap;gap:6px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.rules .st{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
.st.on{color:var(--accent);background:var(--accent-soft)} .st.off{color:var(--ink-3);background:var(--surface-2)}
.payload{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.6;color:var(--ink)}
.payload .c{color:var(--ink-3)}
.flow-lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:180px;overflow-y:auto}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.log time{color:var(--ink-3);font-family:var(--f-mono);font-size:11.5px}
.empty{font-size:12.5px;color:var(--ink-3)}

/* diagnosis */
.diag{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}
@media (max-width:900px){.diag{grid-template-columns:minmax(0,1fr)}}
.qs{display:flex;flex-direction:column;gap:12px}
fieldset{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 16px;margin:0;min-width:0}
legend{font-weight:700;font-size:14px;padding:0 4px}
legend .qn{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.choices label{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;background:var(--surface-2)}
.choices input{accent-color:var(--accent)}
.choices label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.qhint{font-size:12px;color:var(--ink-3);margin-top:6px}
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.typebar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.typebar div{font-size:10.5px;text-align:center;padding:6px 2px;border-radius:6px;background:var(--surface-2);color:var(--ink-3)}
.typebar div.on{background:var(--ink);color:var(--surface);font-weight:700}
.grades{display:flex;flex-wrap:wrap;gap:4px}
.grades .off{opacity:.35}

/* dashboard */
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.dash .wide{grid-column:1/-1}
.card h2{margin:0;font-size:16px}
.card .sub{margin:0;font-size:12.5px;color:var(--ink-2)}
.funnels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.funnels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fn{display:flex;flex-direction:column;gap:6px;min-width:0}
.fn h4{margin:0;font-size:13px}
.fbar{display:grid;grid-template-columns:36px 1fr 34px;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.fbar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.fbar .t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.fn.hl h4::after{content:"주문 전환 최저";margin-left:6px;font-size:10.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px}
.ab{display:flex;flex-direction:column;gap:12px}
.abrow{display:flex;flex-direction:column;gap:4px}
.abrow .l{font-size:12.5px;font-weight:600}
.abbar{display:grid;grid-template-columns:22px 1fr 44px;gap:6px;align-items:center;font-size:11.5px}
.abbar .t{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.abbar .t i{display:block;height:100%;border-radius:0 4px 4px 0}
.ia{background:var(--ink-3)} .ib{background:var(--accent)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
table.t td.n{text-align:right}
table.t th{font-size:12px;color:var(--ink-3);font-weight:600;border-top:0}
.report{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.aitag{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;align-self:flex-start}
footer{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.mod,.rec,.mismatch{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark"><b>FIT</b> 데모</div>
      <p>투자성향 연계형 MTS 개인화 엔진 · 경진대회 시연 프로토타입</p>
    </div>
    <span class="demo-pill">모든 종목·시세·수치는 시연용 가상 데이터</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="시연 단계">
    <button role="tab" id="tab-diag" data-tab="diag"><span class="step">1</span>투자자 진단</button>
    <button role="tab" id="tab-mts" data-tab="mts"><span class="step">2</span>개인화 MTS</button>
    <button role="tab" id="tab-dash" data-tab="dash"><span class="step">3</span>증권사 운영 대시보드</button>
  </nav>

  <section id="view-diag" role="tabpanel" aria-labelledby="tab-diag" hidden></section>
  <section id="view-mts" role="tabpanel" aria-labelledby="tab-mts" hidden></section>
  <section id="view-dash" role="tabpanel" aria-labelledby="tab-dash" hidden></section>

  <footer>본 프로토타입은 경진대회 시연용이며, 실제 증권사·종목·시세와 무관한 가상 데이터를 사용합니다. 주문·계좌 연동·본인인증은 구현하지 않았습니다. 간이 진단의 문항과 배점은 공개된 투자자정보확인서 양식을 단순화한 것으로, 실제 기준은 증권사마다 다릅니다.</footer>
</div>

<script>
(function(){
"use strict";

/* ---------- engine ---------- */
function score(){let s=0;["q1","q2","q3","q4","q5","q6"].forEach(q=>{const opt=QS.find(x=>x.id===q).o[S.ans[q]];s+=opt?opt[1]:0});return s}
function typeIdx(){const s=score();return s<=10?0:s<=15?1:s<=20?2:s<=25?3:4}
function depthDefault(){const v=QS[5].o[S.ans.q6][1];return v<=2?0:v===3?1:2}
function beginner(){return S.ans.q3<=2}
function derivExp(){return S.ans.q7>=2}
function eventsTotal(){const u=S.usage;return u.info+u.asset+u.trade+u.learn}
function shares(){const t=Math.max(1,eventsTotal()),u=S.usage;return{info:u.info/t,asset:u.asset/t,trade:u.trade/t,learn:u.learn/t}}
function classify(){
  const sh=shares(),u=S.usage,pct=x=>Math.round(x*100)+"%";
  if(u.sessions<8&&sh.learn>=.3)return{key:"beginner",path:"접속 "+u.sessions+"회(8회 미만) → 학습 비중 "+pct(sh.learn)+"(30% 이상)"};
  if(sh.trade>=.45)return{key:"trader",path:"학습 조건 불충족 → 매매 비중 "+pct(sh.trade)+"(45% 이상)"};
  if(sh.asset>=.4)return{key:"saver",path:"매매 비중 "+pct(sh.trade)+" → 자산 비중 "+pct(sh.asset)+"(40% 이상)"};
  if(sh.info>=.4)return{key:"explorer",path:"자산 비중 "+pct(sh.asset)+" → 정보 비중 "+pct(sh.info)+"(40% 이상)"};
  return{key:"beginner",path:"뚜렷한 패턴 없음 → 기본값 입문형"};
}
function alertsOn(){return S.alertsManual!=null?S.alertsManual:typeIdx()>1}
function minGrade(){return TYPES[typeIdx()].min}
function outOfRange(id){return S.level>=1&&P[id].g<minGrade()}
function baseOrder(){
  if(S.level===0)return DEFAULT_ORDER.slice();
  const o=DEFAULT_ORDER.slice();
  if(beginner()){o.splice(o.indexOf("guide"),1);o.splice(1,0,"guide")}
  if(!derivExp()&&typeIdx()<=1){/* keep orderbook but after holdings */}
  return o;
}
function homeOrder(){
  const base=baseOrder();if(S.level<2)return{shown:base,folded:[]};
  const ordered=[...S.pinned,...base.filter(m=>!S.pinned.includes(m))];
  if(!S.collapsed)return{shown:ordered,folded:[]};
  const keep=new Set([...S.pinned,...USAGE_TYPES[classify().key].target]);
  return{shown:ordered.filter(m=>keep.has(m)),folded:ordered.filter(m=>!keep.has(m))};
}
function pendingRecs(){
  if(S.level<2)return[];
  const ut=USAGE_TYPES[classify().key],recs=[];
  const top=homeOrder().shown.slice(0,S.pinned.length+2);
  ut.target.forEach(m=>{if(!S.pinned.includes(m)&&!S.snoozed.includes("pin:"+m)&&(recs.length<2))recs.push({kind:"pin",m:m,why:ut.why})});
  if(!S.collapsed&&!S.snoozed.includes("fold")&&S.pinned.length>=1){
    const n=baseOrder().filter(m=>!S.pinned.includes(m)&&!ut.target.includes(m)).length;
    if(n>0)recs.push({kind:"fold",n:n,why:"최근 2주간 거의 열지 않은 메뉴가 "+n+"개 있어요."});
  }
  return S.level===3?recs:recs.slice(0,1);
}
function mismatch(){
  if(S.level<1||S.mismatchOff)return null;
  const ti=typeIdx();if(ti>2)return null;
  const n=Object.keys(S.views).filter(id=>P[id].g===1).reduce((a,id)=>a+S.views[id],0);
  return n>=3?n:null;
}

  const head=(t)=>'<div class="mod-h"><h3>'+t+(pinned?' <span class="pinmark">내가 고정</span>':'')+'</h3></div>';
  const tap=' data-act="tap" data-cat="'+MODS[m].cat+'"';
  switch(m){
  case"assets":return '<div class="mod"'+tap+'>'+head("내 자산")+'<div><div class="big num">12,480,000원</div><div class="num up" style="font-size:12.5px">+387,200원 (+3.20%)</div></div><div class="alloc" aria-hidden="true"><i style="width:46%;background:var(--g2)"></i><i style="width:18%;background:var(--g1)"></i><i style="width:21%;background:var(--g4)"></i><i style="width:15%;background:var(--g6)"></i></div><div class="legend"><span style="--c:var(--g2)">국내주식 46%</span><span style="--c:var(--g1)">해외주식 18%</span><span style="--c:var(--g4)">채권 ETF 21%</span><span style="--c:var(--g6)">RP 15%</span></div></div>';
  case"watch":return '<div class="mod">'+head("관심종목")+WATCH.map(id=>prodRow(id)).join("")+'</div>';
  case"hot":{
    const ti=typeIdx();let list=HOT.slice(),hidden=[];let msg="";
    if(S.level>=1&&ti<=1){hidden=list.filter(id=>P[id].g<minGrade());list=list.filter(id=>P[id].g>=minGrade())}
    if(S.level>=1&&hidden.length)msg='<div class="note warn">투자성향('+TYPES[ti].name+') 적합 범위 밖 상품 '+hidden.length+'개는 급상승 목록에서 뺐어요. 설정에서 바꿀 수 있어요.</div>';
    if(S.level>=1&&ti===2)msg='<div class="note">1~2등급 상품은 요약 정보와 함께 보여드려요.</div>';
    if(S.level>=1&&!alertsOn())msg+='<div class="note">급등 알림(레버리지 ETF 등 적합 범위 밖 상품): 꺼짐'+(S.alertsManual==null?' · 투자성향 기본값':'')+'</div>';
    return '<div class="mod">'+head("급상승 종목")+(list.length?list.map(id=>prodRow(id)).join(""):'<div class="empty">적합 범위 안에서 급상승한 종목이 없어요.</div>')+msg+'</div>';}
  case"brief":{
    const L=[["오늘 코스피는 조금 올랐어요(+0.6%).","반도체 회사들의 주가가 오른 영향이 컸어요."],
      ["코스피 2,948.3(+0.6%), 코스닥 861.2(−0.3%).","외국인 순매수 2,140억 원, 원/달러 1,378원."],
      ["필라델피아 반도체지수 +2.3% 영향으로 대형 반도체주 강세.","미 10년물 금리 4.12%(−5bp), 달러인덱스 103.4로 원화 강세 전환."]];
    let out=[];for(let i=0;i<=d;i++)out=out.concat(L[i]);
    return '<div class="mod"'+tap+'>'+head("AI 시황 브리핑")+'<ul class="plain">'+out.map(x=>'<li>'+x+'</li>').join("")+'</ul><div class="src">정보 깊이: '+DEPTH[d]+' · AI 요약(가상 시황)</div></div>';}
  case"news":return '<div class="mod"'+tap+'>'+head("관심 기업 뉴스")+'<ul class="plain"><li>한빛전자, 차세대 메모리 양산 일정 앞당겨(가상)</li><li>DEMO 코리아 대형주 ETF, 분배금 주당 160원 확정(가상)</li><li>아틀라스 로보틱스, 3분기 매출 전망 상향(가상)</li></ul></div>';
  case"orderbook":return '<div class="mod">'+head("호가·빠른 주문")+'<div style="font-size:12px;color:var(--ink-2)">한빛전자 · 10호가 중 5호가</div><div class="ob num"><span class="s">12,480</span><span class="p">71,400</span><span></span><span class="s">9,120</span><span class="p">71,300</span><span></span><span class="s">15,760</span><span class="p up">71,200</span><span class="b"></span><span></span><span class="p">71,100</span><span class="b">18,340</span><span></span><span class="p">71,000</span><span class="b">22,910</span></div><div class="btns"><button class="btn pri" data-act="tap" data-cat="trade">빠른 주문 열기</button><button class="btn sec" data-act="tap" data-cat="trade">차트 보기</button></div><div class="src">시연용: 주문은 실행되지 않고 이용 신호만 기록돼요.</div></div>';
  case"accum":return '<div class="mod"'+tap+'>'+head("적립식 현황")+'<div class="kv"><dt>DEMO 코리아 대형주</dt><dd class="num">매월 200,000원</dd><dt>누적 매수</dt><dd class="num">14회 · 2,800,000원</dd><dt>다음 매수일</dt><dd class="num">10월 5일</dd></div></div>';
  case"dividend":return '<div class="mod"'+tap+'>'+head("배당·연금")+'<div class="kv"><dt>한빛전자 배당 예정</dt><dd class="num">주당 361원 · 10월 15일</dd><dt>연금저축 계좌</dt><dd class="num">3,200,000원</dd></div></div>';
  case"guide":return '<div class="mod">'+head("투자 용어 가이드")+'<div class="glossary"><button data-act="tap" data-cat="learn"><b>PER</b>이익 대비 주가가 몇 배인지</button><button data-act="tap" data-cat="learn"><b>ETF</b>여러 종목을 묶어 주식처럼 사고파는 상품</button><button data-act="tap" data-cat="learn"><b>예수금</b>주문에 쓸 수 있는 현금</button></div></div>';
  case"basics":return '<div class="mod"'+tap+'>'+head("투자 기초 콘텐츠")+'<ul class="plain"><li>처음 주식을 사기 전 확인할 3가지</li><li>분산투자는 왜 필요할까</li><li>시장가 주문과 지정가 주문의 차이</li></ul></div>';
  }return"";
}

    '<div class="flow-lbl">이용 행동 시뮬레이션 (2주치)</div><div class="sim">'+Object.keys(USAGE_PRESETS).map(k=>'<button class="chipbtn" data-act="usage" data-u="'+k+'">'+USAGE_TYPES[k].name+'</button>').join("")+'</div><div class="src">폰 화면의 카드를 누를 때마다 해당 이용 신호가 1건씩 쌓여요.</div></div>'+
  '<div class="card"><h3>③ 가드레일 · 화면 규칙</h3><ul class="rules">'+rules.map(r=>'<li><span class="st '+(r[0]?"on":"off")+'">'+(r[0]?"적용":"대기")+'</span><span>'+r[1]+'</span></li>').join("")+'</ul></div>'+
  '<div class="card"><h3>④ 엔진으로 전송되는 데이터</h3><div class="payload">'+pl+'</div></div>'+
  '<div class="card"><h3>⑤ 추천·승인 기록</h3>'+(S.log.length?'<ul class="log">'+S.log.map(l=>'<li><time>'+l[0]+'</time><span>'+esc(l[1])+'</span></li>').join("")+'</ul>':'<div class="empty">아직 기록이 없어요.</div>')+'</div>'+
  '</div>';
}
function mtsHtml(){
  return '<div class="scen" role="group" aria-label="빠른 시나리오"><span class="lbl">빠른 시나리오</span>'+Object.keys(SCEN).map(k=>'<button class="chipbtn" data-act="scen" data-s="'+k+'" aria-pressed="'+(S.scen===k)+'">'+SCEN[k].label+'</button>').join("")+'</div><div class="stage" style="margin-top:16px">'+phoneHtml()+panelHtml()+'</div>';
}

/* ---------- diagnosis ---------- */
function diagHtml(){
  const ti=typeIdx(),sc=score(),mg=minGrade();
  const qs=QS.map((q,qi)=>'<fieldset><legend><span class="qn">Q'+(qi+1)+'</span>'+q.t+'</legend><div class="choices">'+q.o.map((o,oi)=>'<label><input type="radio" name="'+q.id+'" id="'+q.id+'-'+oi+'" value="'+oi+'" '+(S.ans[q.id]===oi?"checked":"")+'>'+o[0]+'</label>').join("")+'</div>'+(q.h?'<div class="qhint">'+q.h+'</div>':'')+'</fieldset>').join("");
  const uses=[
    ["투자성향",TYPES[ti].name+" → 적합 위험등급 "+TYPES[ti].range+" 밖 상품에 가드레일 적용"],
    ["투자경험",beginner()?"1년 미만 → 용어 가이드·요약 카드 기본 노출":"1년 이상 → 표준 배치"],
    ["금융지식","종목 화면 기본 깊이 '"+DEPTH[depthDefault()]+"'"],
    ["파생 경험",derivExp()?"1년 이상 → 레버리지·파생 메뉴 기본 노출":"1년 미만 → 레버리지·파생 메뉴는 검색으로만"]
  ];
  return '<div class="diag"><div class="qs"><div class="card"><h2>간이 투자자정보확인서</h2><p class="sub">증권사가 계좌 개설 때 이미 받는 7개 문항을 단순화했어요. FIT는 새 정보를 더 묻지 않고 이 결과를 개인화 기준으로 씁니다.</p></div>'+qs+'</div>'+
  '<div class="card result"><h3>진단 결과</h3><div class="metric"><small>간이 점수</small><strong class="num">'+sc+' / 29</strong></div><div class="typebar">'+TYPES.map((t,i)=>'<div class="'+(i===ti?"on":"")+'">'+t.name+'</div>').join("")+'</div><div class="metric"><small>적합 상품 위험등급</small><div class="grades">'+[1,2,3,4,5,6].map(g=>'<span class="grade g'+g+(g<mg?' off':'')+'">'+g+'등급</span>').join("")+'</div></div><table class="t"><thead><tr><th>문항</th><th>개인화에 쓰는 방식</th></tr></thead><tbody>'+uses.map(u=>'<tr><td>'+u[0]+'</td><td>'+u[1]+'</td></tr>').join("")+'</tbody></table><div class="src">점수 구간: 10점 이하 안정형 · 11~15 안정추구형 · 16~20 위험중립형 · 21~25 적극투자형 · 26 이상 공격투자형 (공개 양식 기준 예시)</div><button class="btn pri" data-act="goto-mts">이 결과로 MTS 보기</button></div></div>';
}

/* ---------- dashboard ---------- */
function dashHtml(){
  const F=[["입문형",[100,46,12]],["탐색형",[100,71,28]],["적립형",[100,38,22]],["매매형",[100,83,64]]];
  const AB=[["주문 화면 도달률",12,19],["7일 재방문율",41,48],["홈에서 3초 안에 첫 탭",54,71]];
  const maxAB=100;
  return '<div class="dash">'+
  '<div class="card wide"><h2>이용 유형별 퍼널 · 검색 → 종목 상세 → 주문 화면</h2><p class="sub">검색 100명 기준 다음 단계 도달 인원. 입문형은 상세에서 주문으로 넘어가는 구간 이탈이 가장 커요.</p><div class="funnels">'+F.map((f,i)=>'<div class="fn'+(i===0?' hl':'')+'"><h4>'+f[0]+'</h4>'+["검색","상세","주문"].map((s,j)=>'<div class="fbar"><span>'+s+'</span><div class="t" title="'+f[0]+' '+s+' '+f[1][j]+'명"><i style="width:'+f[1][j]+'%"></i></div><span class="num">'+f[1][j]+'</span></div>').join("")+'</div>').join("")+'</div><div class="src">시연용 가상 수치</div></div>'+
  '<div class="card"><h2>A/B 테스트 · 입문형 홈 구성안</h2><p class="sub">A 기본 홈과 B FIT 개인화 홈을 입문형 고객에게 2주간 나눠 적용한 결과예요.</p><div class="lg"><span style="--c:var(--ink-3)">A 기본 홈</span><span style="--c:var(--accent)">B FIT 개인화 홈</span></div><div class="ab">'+AB.map(r=>'<div class="abrow"><span class="l">'+r[0]+'</span><div class="abbar"><span>A</span><div class="t" title="A '+r[0]+' '+r[1]+'%"><i class="ia" style="width:'+(r[1]/maxAB*100)+'%"></i></div><span class="num">'+r[1]+'%</span></div><div class="abbar"><span>B</span><div class="t" title="B '+r[0]+' '+r[2]+'%"><i class="ib" style="width:'+(r[2]/maxAB*100)+'%"></i></div><span class="num">'+r[2]+'%</span></div></div>').join("")+'</div><div class="src">시연용 가상 수치 · 실제 운영 시 유의성 검정 후 확대 적용</div></div>'+
  '<div class="card"><h2>가드레일 작동 현황 · 최근 2주</h2><table class="t"><thead><tr><th>항목</th><th style="text-align:right">건수·비율</th></tr></thead><tbody><tr><td>상품 이해 확인 카드 노출</td><td class="n num">1,284건</td></tr><tr><td>카드 확인 후 상세 화면 진입</td><td class="n num">71%</td></tr><tr><td>급상승 목록에서 제외된 노출</td><td class="n num">8,930건</td></tr><tr><td>투자성향 재진단 안내</td><td class="n num">96건</td></tr><tr><td>안내 후 재진단 완료</td><td class="n num">31%</td></tr><tr><td>추천 승인율</td><td class="n num">63%</td></tr></tbody></table><div class="src">시연용 가상 수치</div></div>'+
  '<div class="card wide"><span class="aitag">AI 개선 리포트 · 예시 문안</span><h2>입문형 고객의 주문 전 이탈 개선안</h2><ol class="report"><li>입문형은 종목 상세에서 주문 화면으로 넘어가는 비율이 26%로 네 유형 중 가장 낮습니다(탐색형 39%).</li><li>상세 화면 체류 시간이 긴 고객일수록 이탈이 많아, 정보 부족보다 정보 과다가 원인일 가능성이 있습니다.</li><li>제안: 입문형의 상세 기본 깊이를 \'요약\'으로 유지하고, 주문 전 예상 수수료·필요 예수금을 한 카드로 합치는 구성안 C를 다음 A/B 테스트 대상으로 추천합니다.</li></ol><div class="src">생성형 AI는 집계된 수치로 문장만 작성하고, 화면 규칙 변경은 기획자가 결정합니다. 수치는 시연용 가상 데이터입니다.</div></div>'+
  '</div>';
}

/* ---------- render & events ---------- */
function render(){
  ["diag","mts","dash"].forEach(t=>{$("#view-"+t).hidden=S.tab!==t;$("#tab-"+t).setAttribute("aria-selected",S.tab===t)});
  const sc=$("#screen"),st=sc?sc.scrollTop:0;
  if(S.tab==="diag")$("#view-diag").innerHTML=diagHtml();
  if(S.tab==="mts"){$("#view-mts").innerHTML=mtsHtml();const n=$("#screen");if(n&&S.keepScroll)n.scrollTop=st;S.keepScroll=false}
  if(S.tab==="dash")$("#view-dash").innerHTML=dashHtml();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-act]");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;render();return}
  const a=b.dataset.act;
  if(a!=="open"&&a!=="tap"&&!a.startsWith("tab-"))e.stopPropagation();
  switch(a){
    case"scen":loadScenario(b.dataset.s);break;
    case"usage":S.usage=Object.assign({},USAGE_PRESETS[b.dataset.u]);S.pinned=[];S.snoozed=[];S.collapsed=false;note("이용 행동을 '"+USAGE_TYPES[b.dataset.u].name+"' 패턴으로 시뮬레이션");break;
    case"open":{const id=b.dataset.id;bump("info");S.detail=id;S.screen="detail";
      if(outOfRange(id)){S.views[id]=(S.views[id]||0)+1;
        const ti=typeIdx();if(!S.acked[id]&&ti<=3&&!(ti===3&&P[id].g>1))S.sheet=id;}
      break;}
    case"tap":bump(b.dataset.cat);S.keepScroll=true;break;
    case"ack":note("'"+P[S.sheet].name+"' 상품 이해 확인 카드 확인");S.acked[S.sheet]=true;S.sheet=null;break;
    case"home":S.screen="home";S.detail=null;break;
    case"depth":S.depthPick[S.detail]=+b.dataset.d;note("정보 깊이를 '"+DEPTH[+b.dataset.d]+"'로 직접 변경");S.keepScroll=true;break;
    case"approve":S.pinned.push(b.dataset.m);note("추천 승인: '"+MODS[b.dataset.m].t+"' 홈 상단 고정");break;
    case"decline":S.snoozed.push("pin:"+b.dataset.m);note("추천 거절: '"+MODS[b.dataset.m].t+"' (같은 제안 일정 기간 숨김)");break;
    case"fold":S.collapsed=true;note("추천 승인: 자주 쓰지 않는 메뉴 접기");break;
    case"nofold":S.snoozed.push("fold");note("추천 거절: 메뉴 접기");break;
    case"unfold":S.collapsed=false;S.snoozed.push("fold");note("접힌 메뉴 다시 펼침");break;
    case"rediag":note("투자성향 재진단으로 이동");S.mismatchOff=true;S.tab="diag";S.screen="home";break;
    case"nomm":S.mismatchOff=true;note("재진단 안내 닫음");break;
    case"goto-mts":S.tab="mts";S.screen="home";note("진단 결과 반영: "+TYPES[typeIdx()].name);break;
    default:
      if(a.startsWith("tab-")){const t=a.slice(4);if(b.dataset.cat)bump(b.dataset.cat);
        if(t==="home"||t==="settings")S.screen=t;else S.screen="home";S.detail=null;}
  }
  render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.name&&/^q\d$/.test(t.name)){S.ans[t.name]=+t.value;S.scen=null;render();return}
  if(t.name==="lvl"){S.level=+t.value;note("개인화 수준 변경: "+["사용 안 함","투자성향만","이용 패턴 포함","적극 추천"][S.level]);render();return}
  if(t.id==="alerts"){S.alertsManual=t.checked;note("급등 알림 "+(t.checked?"켬":"끔"));render()}
});
const hashTab=(location.hash||"").slice(1);
loadScenario("A");S.log=[];note("시나리오 A 불러옴: 입문 + 안정추구형");
if(["diag","mts","dash"].includes(hashTab))S.tab=hashTab;
render();
})();
</script>
</body>
</html>
